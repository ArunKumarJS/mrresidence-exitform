<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MR Residence – Tenant Exit Form</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --crimson: #7a1032; --crimson-deep: #5a0a22;
    --rose-gold: #c9956a; --rose-gold-light: #e8c4a8;
    --cream: #f5ede4; --cream-dark: #ede2d6;
    --white: #ffffff; --text-dark: #2a1015;
    --text-mid: #5c3040; --text-light: #9a7080;
    --border: #d4b0b8; --success: #2d7a4f; --err: #c0392b;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; font-family: Inter, sans-serif; background: var(--cream); color: var(--text-dark); }

  .header { background: linear-gradient(135deg, var(--crimson-deep) 0%, var(--crimson) 60%, #9b1a3e 100%); padding: 28px 24px 32px; text-align: center; position: relative; overflow: hidden; }
  .header::before { content: ''; position: absolute; inset: 0; background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"); }
  .header img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 2px solid var(--rose-gold); display: block; margin: 0 auto 14px; position: relative; z-index: 1; }
  .header h1 { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 600; color: var(--white); letter-spacing: 3px; text-transform: uppercase; position: relative; z-index: 1; margin-bottom: 4px; }
  .header p.sub { font-size: 11px; font-weight: 300; color: var(--rose-gold-light); letter-spacing: 2px; text-transform: uppercase; position: relative; z-index: 1; }

  .content { max-width: 720px; margin: 0 auto; padding: 28px 20px 60px; }
  .note { font-size: 12px; color: var(--text-light); text-align: center; margin-bottom: 16px; }

  .setup-banner { background: #fff8e1; border: 1.5px solid #f9a825; border-radius: 10px; padding: 14px 18px; margin-bottom: 20px; font-size: 13px; color: #5d4037; }
  .setup-banner strong { color: #e65100; }
  .setup-banner code { background: #ffe0b2; padding: 1px 5px; border-radius: 4px; font-size: 12px; }

  .form-section { background: var(--white); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; box-shadow: 0 2px 16px rgba(122,16,50,.06); margin-bottom: 20px; }
  .section-header { background: var(--cream-dark); padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .section-header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--crimson); }
  .section-header h2 { font-family: 'Cormorant Garamond', serif; font-size: 16px; font-weight: 600; color: var(--crimson); letter-spacing: 1px; }
  .fields { padding: 20px; display: grid; gap: 16px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 500px) { .field-row { grid-template-columns: 1fr; } }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 11px; font-weight: 500; color: var(--text-mid); letter-spacing: .8px; text-transform: uppercase; }
  .field input, .field select, .field textarea { padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 7px; font-family: Inter, sans-serif; font-size: 14px; color: var(--text-dark); background: var(--white); transition: border-color .2s, box-shadow .2s; outline: none; width: 100%; }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--rose-gold); box-shadow: 0 0 0 3px rgba(201,149,106,.15); }
  .field textarea { resize: vertical; min-height: 72px; }
  .required { color: var(--crimson); }

  .damage-row { display: grid; grid-template-columns: 1fr 140px; gap: 10px; align-items: end; padding: 12px 16px; background: var(--cream); border-radius: 8px; border: 1px dashed var(--border); }
  .damage-label { font-size: 12px; font-weight: 500; color: var(--text-mid); margin-bottom: 4px; }

  .submit-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, var(--crimson) 0%, var(--crimson-deep) 100%); color: var(--white); border: none; border-radius: 10px; font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 600; letter-spacing: 2px; cursor: pointer; transition: transform .15s, box-shadow .15s; box-shadow: 0 4px 16px rgba(122,16,50,.25); margin-top: 8px; }
  .submit-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(122,16,50,.35); }
  .submit-btn:active { transform: translateY(0); }
  .submit-btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }

  .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-80px); padding: 14px 24px; border-radius: 10px; font-size: 14px; font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,.2); transition: transform .35s cubic-bezier(.34,1.56,.64,1); z-index: 999; white-space: nowrap; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.ok { background: var(--success); color: #fff; }
  .toast.err { background: var(--err); color: #fff; }
</style>
</head>

  <p class="note">Fields marked <span style="color:var(--crimson)">*</span> are required. Data saves directly to your shared Google Sheet.</p>

  <div class="form-section">
    <div class="section-header"><div class="dot"></div><h2>Tenant Details</h2></div>
    <div class="fields">
      <div class="field-row">
        <div class="field"><label>S.No <span class="required">*</span></label><input type="text" id="sno" placeholder="e.g. 001"></div>
        <div class="field"><label>Tenant Name <span class="required">*</span></label><input type="text" id="name" placeholder="Full name"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Date of Admission <span class="required">*</span></label><input type="date" id="dateAdm"></div>
        <div class="field"><label>Date of Exit <span class="required">*</span></label><input type="date" id="dateExit"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Room Number</label><input type="text" id="roomNo" placeholder="e.g. 204"></div>
        <div class="field"><label>Phone Number</label><input type="tel" id="phone" placeholder="10-digit mobile"></div>
      </div>
    </div>
  </div>

  <div class="form-section">
    <div class="section-header"><div class="dot"></div><h2>Advance Details</h2></div>
    <div class="fields">
      <div class="field-row">
        <div class="field"><label>Advance Paid (₹) <span class="required">*</span></label><input type="number" id="advPaid" placeholder="Amount"></div>
        <div class="field"><label>Advance Returned on Exit (₹)</label><input type="number" id="advReturned" placeholder="After deductions"></div>
      </div>
      <div class="field"><label>Reason for Deduction</label><textarea id="deductionReason" placeholder="Describe reason if any deduction from advance…"></textarea></div>
    </div>
  </div>

  <div class="form-section">
    <div class="section-header"><div class="dot"></div><h2>Amount Deducted for Damage</h2></div>
    <div class="fields">
      <div class="damage-row">
        <div><div class="damage-label">Damage Reason</div><input type="text" id="damageReason" placeholder="e.g. Broken window, stained mattress"></div>
        <div><div class="damage-label">Amount (₹)</div><input type="number" id="damageAmt" placeholder="0"></div>
      </div>
    </div>
  </div>

  <div class="form-section">
    <div class="section-header"><div class="dot"></div><h2>Key &amp; Clearance</h2></div>
    <div class="fields">
      <div class="field-row">
        <div class="field"><label>Key Handed Over?</label>
          <select id="keyHanded"><option value="">— Select —</option><option>Yes</option><option>No</option></select>
        </div>
        <div class="field"><label>Clearance Status</label>
          <select id="clearance"><option value="">— Select —</option><option>Cleared</option><option>Pending</option><option>Disputed</option></select>
        </div>
      </div>
      <div class="field"><label>Remarks / Additional Notes</label><textarea id="remarks" placeholder="Any remarks from management…"></textarea></div>
    </div>
  </div>

  <button class="submit-btn" id="submitBtn" onclick="submitForm()">Submit Exit Record</button>
</div>

<div class="toast" id="toast"></div>

<script>
  // ══════════════════════════════════════════════════════════════
  //  STEP 1 — Paste your Google Apps Script Web App URL here:
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyQAScafMOf3vpgnEaptTB8l6tLNmv-Lz1kxgImidasH8TzAgtfKaxEofbgK2oRvw2uxQ/exec';
  // ══════════════════════════════════════════════════════════════

  function v(id) { return (document.getElementById(id).value || '').trim(); }

  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + type;
    setTimeout(() => t.classList.remove('show'), 4000);
  }

  function clearForm() {
    ['sno','name','dateAdm','dateExit','roomNo','phone',
     'advPaid','advReturned','deductionReason','damageReason','damageAmt','remarks']
      .forEach(id => document.getElementById(id).value = '');
    document.getElementById('keyHanded').value = '';
    document.getElementById('clearance').value = '';
  }

  async function submitForm() {
    if (SCRIPT_URL === 'YOUR_APPS_SCRIPT_URL') {
      showToast('⚠ Please set your Apps Script URL first (see README).', 'err'); return;
    }
    if (!v('sno') || !v('name') || !v('dateAdm') || !v('dateExit') || !v('advPaid')) {
      showToast('⚠ Please fill all required fields.', 'err'); return;
    }
    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = 'Saving…';

    const row = [
      v('sno'), v('name'), v('roomNo'), v('phone'),
      v('dateAdm'), v('dateExit'),
      v('advPaid'), v('advReturned'),
      v('deductionReason'), v('damageReason'), v('damageAmt'),
      v('keyHanded'), v('clearance'), v('remarks'),
      new Date().toLocaleString('en-IN')
    ];

    try {
      // Google Apps Script requires no-cors; we use an image trick as fallback
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ row })
      });
      // no-cors = opaque response, so we assume success if no network error
      showToast('✓ Exit record saved to Google Sheets!', 'ok');
      clearForm();
    } catch (e) {
      showToast('⚠ Network error – check your internet connection.', 'err');
    } finally {
      btn.disabled = false; btn.textContent = 'Submit Exit Record';
    }
  }
</script>
</body>
</html>
